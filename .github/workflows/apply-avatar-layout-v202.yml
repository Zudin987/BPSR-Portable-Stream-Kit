name: Apply v2.0.2 avatar layout fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'hotfix/v2.0.2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v2.0.2
          fetch-depth: 0

      - name: Apply source fixes
        run: python3 scripts/apply_avatar_layout_v202.py

      - name: Remove temporary applicator
        run: |
          rm scripts/apply_avatar_layout_v202.py
          rm .github/workflows/apply-avatar-layout-v202.yml
          rm -f .trigger-avatar-layout-v202

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-fit vtuber and add it to live scenes"
          git push origin HEAD:hotfix/v2.0.2
