name: Release Beginner UX

on:
  push:
    branches: ['release/v2.*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows self-contained app
        shell: pwsh
        run: |
          dotnet restore src/BPSRStreamKit/BPSRStreamKit.csproj
          dotnet publish src/BPSRStreamKit/BPSRStreamKit.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Add beginner quick-start
        shell: pwsh
        run: |
          @"
          StreamKit v2.0.2 - Beginner-Friendly UI

          1. Open your game.
          2. Run BPSRStreamKit.exe and choose the game + avatar.
          3. Choose Discord only or Discord + Twitch + TikTok, then press the big button.

          Discord:
          - StreamKit opens the clean share window automatically.
          - In Discord, Share Your Screen -> choose that projector/share window and enable sound.
          - Keep your normal Discord microphone selected. StreamKit keeps its own mic out of the Discord share so your voice is not doubled.

          Full VTuber, first time only:
          - StreamKit opens VTube Studio through Steam automatically.
          - Turn on the VTube Studio output switch named Spout2 output.
          - Backgrounds -> Color Picker Background -> Transparent in capture.
          - Click Check my avatar in StreamKit. StreamKit now repairs/recreates the OBS Spout2 avatar source automatically and checks the actual video.
          - If the normal VTubeStudioSpout sender is not available, StreamKit automatically tries the active Spout sender.

          Fix setup:
          - Fix setup closes only StreamKit's portable OBS, backs up the generated scene JSON, rebuilds the StreamKit scenes, and keeps your account/stream settings.
          - This also repairs old paths after moving or extracting StreamKit into a different folder.

          Twitch + TikTok, first time only:
          - StreamKit shows exact account-connection steps in the app.
          - After the one-time connection, normal streaming does not require operating OBS.

          Audio safety is automatic:
          - Discord share: selected game sound, no duplicate StreamKit microphone.
          - Twitch/TikTok: selected game + cleaned microphone.
          - Desktop/system audio is excluded so Discord friends and notifications are not intentionally sent to public streams.
          "@ | Set-Content publish/START_HERE.txt -Encoding UTF8

      - name: Package StreamKit-BeginnerUX.zip
        shell: pwsh
        run: |
          if (Test-Path StreamKit-BeginnerUX.zip) { Remove-Item StreamKit-BeginnerUX.zip -Force }
          Compress-Archive -Path publish/* -DestinationPath StreamKit-BeginnerUX.zip -Force
          $check = Join-Path $env:RUNNER_TEMP 'streamkit-beginner-check'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive StreamKit-BeginnerUX.zip $check -Force
          if (-not (Test-Path (Join-Path $check 'BPSRStreamKit.exe'))) { throw 'Packaged ZIP is missing BPSRStreamKit.exe' }
          if (-not (Test-Path (Join-Path $check 'START_HERE.txt'))) { throw 'Packaged ZIP is missing START_HERE.txt' }

      - uses: actions/upload-artifact@v4
        with:
          name: StreamKit-BeginnerUX
          path: StreamKit-BeginnerUX.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = "${{ github.ref_name }}".Replace("release/", "")
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $version --cleanup-tag --yes
          }
          $target = ((git ls-remote origin refs/heads/main) -split "`t")[0]
          gh release create $version StreamKit-BeginnerUX.zip --target $target --title "$version - StreamKit Beginner UX" --notes "Fixes Check my avatar and Fix setup: StreamKit now rebuilds generated OBS scenes safely, restarts stale portable OBS before editing, self-heals the Spout2 avatar source at runtime, and falls back to the active Spout sender automatically."
