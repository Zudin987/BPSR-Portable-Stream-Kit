name: Apply v2.0.1 hotfix

on:
  push:
    branches: ['hotfix/v2.0.1']

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v2.0.1
          fetch-depth: 0

      - name: Apply source hotfix
        run: python3 scripts/apply_v201_hotfix.py

      - name: Remove temporary applicator
        run: |
          rm scripts/apply_v201_hotfix.py
          rm .github/workflows/apply-v201-hotfix.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore avatar startup and portable scene recovery"
          git push origin HEAD:hotfix/v2.0.1
