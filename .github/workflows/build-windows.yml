name: Build Windows Stream Kit

on:
  push:
    branches:
      - main
      - 'release/v*'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/BPSRStreamKit/BPSRStreamKit.csproj

      - name: Publish self-contained launcher
        run: dotnet publish src/BPSRStreamKit/BPSRStreamKit.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Copy portable assets and templates
        shell: pwsh
        run: |
          if (Test-Path publish/Assets) { Remove-Item publish/Assets -Recurse -Force }
          if (Test-Path publish/templates) { Remove-Item publish/templates -Recurse -Force }
          Copy-Item -Path Assets -Destination publish/Assets -Recurse -Force
          Copy-Item -Path templates -Destination publish/templates -Recurse -Force

          $required = @(
            'publish/Assets/Frames/01_Minimal_Thin_1080p.png',
            'publish/Assets/Frames/05_TikTok_Minimal_1080x1920.png',
            'publish/Assets/Screens/Starting_1080p.png',
            'publish/Assets/Screens/BRB_1080p.png',
            'publish/Assets/MyAvatar/idle.png',
            'publish/Assets/MyAvatar/talk_a.png',
            'publish/Assets/MyAvatar/talk_b.png',
            'publish/templates/basic/scenes/BPSR_Horizontal.json',
            'publish/templates/basic/scenes/BPSR_TikTok_Vertical.json'
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required release file is missing: $file" }
          }

      - name: Add release notes
        shell: pwsh
        run: |
          Copy-Item README.md publish/README.md -Force
          @"
          StreamKit v0.2.0

          1. Extract the whole ZIP.
          2. Open BPSRStreamKit.exe and approve the Administrator prompt.
          3. Pick Discord, Twitch, or TikTok.
          4. Pick BPSR or another detected game.
          5. Press the large Start button.

          BPSR uses the full DPS/HUD layout. Other games use the clean Game + Frame + Avatar layout.
          The first launch downloads the pinned portable OBS/FloodTuber builds. No normal OBS installation is required.
          "@ | Set-Content publish/START_HERE.txt -Encoding UTF8

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath BPSR-Portable-Stream-Kit-win-x64.zip -Force

      - name: Verify packaged ZIP
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'streamkit-package-check'
          if (Test-Path $checkDir) { Remove-Item $checkDir -Recurse -Force }
          Expand-Archive BPSR-Portable-Stream-Kit-win-x64.zip -DestinationPath $checkDir -Force

          $required = @(
            'Assets/Frames/01_Minimal_Thin_1080p.png',
            'Assets/Frames/05_TikTok_Minimal_1080x1920.png',
            'Assets/Screens/Starting_1080p.png',
            'Assets/Screens/BRB_1080p.png',
            'Assets/MyAvatar/idle.png',
            'Assets/MyAvatar/talk_a.png',
            'Assets/MyAvatar/talk_b.png',
            'templates/basic/scenes/BPSR_Horizontal.json',
            'templates/basic/scenes/BPSR_TikTok_Vertical.json',
            'BPSRStreamKit.exe'
          )

          foreach ($relative in $required) {
            $file = Join-Path $checkDir $relative
            if (-not (Test-Path $file)) { throw "Packaged ZIP verification failed. Missing: $relative" }
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPSR-Portable-Stream-Kit-win-x64
          path: BPSR-Portable-Stream-Kit-win-x64.zip
          if-no-files-found: error

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $refName = "${{ github.ref_name }}"
          if ("${{ github.ref }}" -like "refs/heads/release/v*") {
            $version = $refName.Substring("release/".Length)
          } else {
            $version = $refName
          }

          if (gh release view "$version" 2>$null) {
            gh release upload "$version" BPSR-Portable-Stream-Kit-win-x64.zip --clobber
          } else {
            gh release create "$version" BPSR-Portable-Stream-Kit-win-x64.zip --target "${{ github.sha }}" --generate-notes --title "StreamKit $version"
          }

          New-Item -ItemType Directory -Force -Path release-status | Out-Null
          @"
          release=$version
          status=published
          commit=${{ github.sha }}
          artifact=BPSR-Portable-Stream-Kit-win-x64.zip
          "@ | Set-Content "release-status/$version.txt" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status
          git commit -m "Record $version release [skip ci]"
          git push origin HEAD:"${{ github.ref_name }}"
