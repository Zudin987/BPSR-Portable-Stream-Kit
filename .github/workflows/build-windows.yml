name: Build Windows StreamKit

on:
  push:
    branches: [main, 'release/v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build launcher
        run: |
          dotnet restore src/BPSRStreamKit/BPSRStreamKit.csproj
          dotnet publish src/BPSRStreamKit/BPSRStreamKit.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Copy portable assets
        shell: pwsh
        run: |
          if (Test-Path publish/Assets) { Remove-Item publish/Assets -Recurse -Force }
          if (Test-Path publish/templates) { Remove-Item publish/templates -Recurse -Force }
          Copy-Item Assets publish/Assets -Recurse -Force
          Copy-Item templates publish/templates -Recurse -Force
          Copy-Item README.md publish/README.md -Force
          Copy-Item THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md -Force

      - name: Generate themed frames and intermission screens
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          function Add-SakuraFlower([Drawing.Graphics]$g,[Drawing.Brush]$brush,[int]$cx,[int]$cy,[int]$s) {
            $p=[int][Math]::Max(2,[Math]::Round($s*0.46))
            $g.FillEllipse($brush,$cx-$p,$cy-$s,$p*2,$s)
            $g.FillEllipse($brush,$cx-$p,$cy,$p*2,$s)
            $g.FillEllipse($brush,$cx-$s,$cy-$p,$s,$p*2)
            $g.FillEllipse($brush,$cx,$cy-$p,$s,$p*2)
            $g.FillEllipse($brush,$cx-$p,$cy-$p,$p*2,$p*2)
          }

          function Add-Sparkle([Drawing.Graphics]$g,[Drawing.Pen]$pen,[int]$x,[int]$y,[int]$r) {
            $g.DrawLine($pen,$x-$r,$y,$x+$r,$y)
            $g.DrawLine($pen,$x,$y-$r,$x,$y+$r)
            $d=[int][Math]::Max(2,[Math]::Round($r*0.6))
            $g.DrawLine($pen,$x-$d,$y-$d,$x+$d,$y+$d)
            $g.DrawLine($pen,$x-$d,$y+$d,$x+$d,$y-$d)
          }

          function Add-MedicalCross([Drawing.Graphics]$g,[Drawing.Pen]$pen,[int]$x,[int]$y,[int]$r) {
            $g.DrawLine($pen,$x-$r,$y,$x+$r,$y)
            $g.DrawLine($pen,$x,$y-$r,$x,$y+$r)
          }

          function New-SakuraFrame([string]$Path,[int]$W,[int]$H) {
            New-Item -ItemType Directory -Force -Path (Split-Path $Path) | Out-Null
            $bmp=[Drawing.Bitmap]::new($W,$H,[Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.Clear([Drawing.Color]::Transparent)

            $pink=[Drawing.Color]::FromArgb(238,231,116,176)
            $violet=[Drawing.Color]::FromArgb(180,177,124,241)
            $soft=[Drawing.Color]::FromArgb(205,255,199,225)
            $faint=[Drawing.Color]::FromArgb(130,255,222,238)
            $p1=[Drawing.Pen]::new($pink,2)
            $p2=[Drawing.Pen]::new($violet,1)
            $p3=[Drawing.Pen]::new($faint,1)
            $spark=[Drawing.Pen]::new($soft,1)
            $b=[Drawing.SolidBrush]::new($soft)
            $b2=[Drawing.SolidBrush]::new($faint)

            $m=1; $i=5
            $g.DrawRectangle($p1,$m,$m,$W-(2*$m)-1,$H-(2*$m)-1)
            $g.DrawRectangle($p2,$i,$i,$W-(2*$i)-1,$H-(2*$i)-1)

            $s=[int][Math]::Max(8,[Math]::Round([Math]::Min($W,$H)*0.010))
            Add-SakuraFlower $g $b ($i+28) ($i+28) $s
            Add-SakuraFlower $g $b ($W-$i-29) ($i+28) $s
            Add-SakuraFlower $g $b ($i+28) ($H-$i-29) $s
            Add-SakuraFlower $g $b ($W-$i-29) ($H-$i-29) $s

            $branch=[int][Math]::Max(52,[Math]::Round([Math]::Min($W,$H)*0.070))
            $g.DrawArc($p3,$i+12,$i+10,$branch,$branch,180,90)
            $g.DrawArc($p3,$W-$i-$branch-14,$i+10,$branch,$branch,270,90)
            $g.DrawArc($p3,$i+12,$H-$i-$branch-12,$branch,$branch,90,90)
            $g.DrawArc($p3,$W-$i-$branch-14,$H-$i-$branch-12,$branch,$branch,0,90)

            $mini=[int][Math]::Max(4,[Math]::Round($s*0.55))
            Add-SakuraFlower $g $b2 ($i+$branch-3) ($i+18) $mini
            Add-SakuraFlower $g $b2 ($W-$i-$branch+2) ($i+18) $mini
            Add-SakuraFlower $g $b2 ($i+$branch-3) ($H-$i-19) $mini
            Add-SakuraFlower $g $b2 ($W-$i-$branch+2) ($H-$i-19) $mini

            $cx=[int]($W*0.5); $cy=[int]($H*0.5)
            Add-Sparkle $g $spark $cx ($i+8) 9
            Add-Sparkle $g $spark $cx ($H-$i-9) 9
            Add-Sparkle $g $spark ($i+8) $cy 7
            Add-Sparkle $g $spark ($W-$i-9) $cy 7

            $petal=[int][Math]::Max(5,[Math]::Round($s*0.62))
            $g.FillEllipse($b2,[int]($W*0.24),$i+13,$petal,$petal*2)
            $g.FillEllipse($b2,[int]($W*0.76),$H-$i-13-$petal*2,$petal,$petal*2)
            $g.FillEllipse($b2,$i+13,[int]($H*0.30),$petal*2,$petal)
            $g.FillEllipse($b2,$W-$i-13-$petal*2,[int]($H*0.70),$petal*2,$petal)

            $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Png)
            $b2.Dispose();$b.Dispose();$spark.Dispose();$p3.Dispose();$p2.Dispose();$p1.Dispose();$g.Dispose();$bmp.Dispose()
          }

          function New-MedicalFrame([string]$Path,[int]$W,[int]$H) {
            New-Item -ItemType Directory -Force -Path (Split-Path $Path) | Out-Null
            $bmp=[Drawing.Bitmap]::new($W,$H,[Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.Clear([Drawing.Color]::Transparent)

            $cyan=[Drawing.Color]::FromArgb(238,31,211,235)
            $white=[Drawing.Color]::FromArgb(220,238,252,255)
            $soft=[Drawing.Color]::FromArgb(175,111,231,242)
            $faint=[Drawing.Color]::FromArgb(115,130,230,242)
            $p1=[Drawing.Pen]::new($cyan,2)
            $p2=[Drawing.Pen]::new($white,1)
            $p3=[Drawing.Pen]::new($soft,2)
            $p4=[Drawing.Pen]::new($faint,1)
            $m=1; $i=5
            $g.DrawRectangle($p1,$m,$m,$W-(2*$m)-1,$H-(2*$m)-1)
            $g.DrawRectangle($p2,$i,$i,$W-(2*$i)-1,$H-(2*$i)-1)

            $r=[int][Math]::Max(10,[Math]::Round([Math]::Min($W,$H)*0.011))
            Add-MedicalCross $g $p3 ($i+26) ($i+26) $r
            Add-MedicalCross $g $p3 ($W-$i-27) ($i+26) $r
            Add-MedicalCross $g $p3 ($i+26) ($H-$i-27) $r
            Add-MedicalCross $g $p3 ($W-$i-27) ($H-$i-27) $r

            $cx=[int]($W*0.50); $step=[int][Math]::Max(9,[Math]::Round([Math]::Min($W,$H)*0.009)); $top=$i+10
            $ecg=[Drawing.Point[]]@(
              [Drawing.Point]::new($cx-(5*$step),$top),
              [Drawing.Point]::new($cx-(3*$step),$top),
              [Drawing.Point]::new($cx-(2*$step),$top-$step),
              [Drawing.Point]::new($cx-$step,$top+$step),
              [Drawing.Point]::new($cx,$top-(2*$step)),
              [Drawing.Point]::new($cx+$step,$top+$step),
              [Drawing.Point]::new($cx+(2*$step),$top),
              [Drawing.Point]::new($cx+(5*$step),$top)
            )
            $g.DrawLines($p3,$ecg)
            $bottom=$H-$i-11
            $ecg2=[Drawing.Point[]]@(
              [Drawing.Point]::new($cx-(5*$step),$bottom),
              [Drawing.Point]::new($cx-(3*$step),$bottom),
              [Drawing.Point]::new($cx-(2*$step),$bottom+$step),
              [Drawing.Point]::new($cx-$step,$bottom-$step),
              [Drawing.Point]::new($cx,$bottom+(2*$step)),
              [Drawing.Point]::new($cx+$step,$bottom-$step),
              [Drawing.Point]::new($cx+(2*$step),$bottom),
              [Drawing.Point]::new($cx+(5*$step),$bottom)
            )
            $g.DrawLines($p4,$ecg2)

            $pillW=[int][Math]::Max(18,[Math]::Round($r*1.8)); $pillH=[int][Math]::Max(8,[Math]::Round($r*0.75))
            $g.DrawEllipse($p4,$i+15,[int]($H*0.32),$pillW,$pillH)
            $g.DrawLine($p4,$i+15+[int]($pillW/2),[int]($H*0.32),$i+15+[int]($pillW/2),[int]($H*0.32)+$pillH)
            $g.DrawEllipse($p4,$W-$i-15-$pillW,[int]($H*0.68),$pillW,$pillH)
            $g.DrawLine($p4,$W-$i-15-[int]($pillW/2),[int]($H*0.68),$W-$i-15-[int]($pillW/2),[int]($H*0.68)+$pillH)

            $dotR=[int][Math]::Max(3,[Math]::Round($r*0.28))
            foreach($f in @(0.20,0.40,0.60,0.80)) {
              $x=[int]($W*$f)
              $g.DrawEllipse($p4,$x-$dotR,$i+14,$dotR*2,$dotR*2)
              $g.DrawEllipse($p4,$x-$dotR,$H-$i-14-($dotR*2),$dotR*2,$dotR*2)
            }

            $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Png)
            $p4.Dispose();$p3.Dispose();$p2.Dispose();$p1.Dispose();$g.Dispose();$bmp.Dispose()
          }

          function New-ThemeScreen([string]$Path,[int]$W,[int]$H,[string]$Title,[string]$Theme) {
            New-Item -ItemType Directory -Force -Path (Split-Path $Path) | Out-Null
            $bmp=[Drawing.Bitmap]::new($W,$H,[Drawing.Imaging.PixelFormat]::Format24bppRgb)
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $vertical=$H -gt $W

            if($Theme -eq 'sakura') {
              $bg=[Drawing.Color]::FromArgb(20,12,28)
              $accent=[Drawing.Color]::FromArgb(232,122,177)
              $accent2=[Drawing.Color]::FromArgb(177,126,239)
              $white=[Drawing.Color]::FromArgb(251,241,249)
            } else {
              $bg=[Drawing.Color]::FromArgb(7,15,24)
              $accent=[Drawing.Color]::FromArgb(58,215,232)
              $accent2=[Drawing.Color]::FromArgb(206,248,255)
              $white=[Drawing.Color]::FromArgb(238,252,255)
            }
            $g.Clear($bg)

            $m=[int][Math]::Max(10,[Math]::Round([Math]::Min($W,$H)*0.012))
            $p=[Drawing.Pen]::new($accent,2)
            $p2=[Drawing.Pen]::new($accent2,1)
            $g.DrawRectangle($p,$m,$m,$W-(2*$m)-1,$H-(2*$m)-1)
            $g.DrawRectangle($p2,$m+7,$m+7,$W-(2*($m+7))-1,$H-(2*($m+7))-1)

            if($vertical) { $ts=[single][Math]::Max(48,$W*0.060) }
            else { $ts=[single][Math]::Max(50,$H*0.060) }
            $tf=[Drawing.Font]::new('Segoe UI',$ts,[Drawing.FontStyle]::Bold)
            $wb=[Drawing.SolidBrush]::new($white)
            $size=$g.MeasureString($Title,$tf)
            $tx=[single](($W-$size.Width)/2)
            $ty=[single](($H-$size.Height)/2)
            $g.DrawString($Title,$tf,$wb,$tx,$ty)

            if($Theme -eq 'sakura') {
              $b=[Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(175,255,192,222))
              $s=[int][Math]::Max(10,[Math]::Round([Math]::Min($W,$H)*0.012))
              Add-SakuraFlower $g $b ($m+34) ($m+34) $s
              Add-SakuraFlower $g $b ($W-$m-35) ($H-$m-35) $s
              $spark=[Drawing.Pen]::new([Drawing.Color]::FromArgb(160,255,214,232),1)
              Add-Sparkle $g $spark ([int]($W*0.18)) ([int]($H*0.25)) 8
              Add-Sparkle $g $spark ([int]($W*0.82)) ([int]($H*0.75)) 8
              $spark.Dispose();$b.Dispose()
            } else {
              $med=[Drawing.Pen]::new($accent,2)
              $r2=[int][Math]::Max(12,[Math]::Round([Math]::Min($W,$H)*0.014))
              Add-MedicalCross $g $med ($m+40) ($H-$m-42) $r2
              Add-MedicalCross $g $med ($W-$m-41) ($m+40) $r2
              $med.Dispose()
            }

            if([IO.Path]::GetExtension($Path).ToLowerInvariant() -eq '.jpg') {
              $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Jpeg)
            } else {
              $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Png)
            }
            $tf.Dispose();$wb.Dispose();$p.Dispose();$p2.Dispose();$g.Dispose();$bmp.Dispose()
          }

          New-SakuraFrame 'publish/Assets/Frames/01_Minimal_Thin_1080p.png' 1920 1080
          New-SakuraFrame 'publish/Assets/Frames/05_TikTok_Minimal_1080x1920.png' 1080 1920
          New-ThemeScreen 'publish/Assets/Screens/Starting_1080p.png' 1920 1080 'STARTING SOON' 'sakura'
          New-ThemeScreen 'publish/Assets/Screens/BRB_1080p.png' 1920 1080 'BE RIGHT BACK' 'sakura'
          New-ThemeScreen 'publish/Assets/Screens/Starting_TikTok_1080x1920.png' 1080 1920 'STARTING SOON' 'sakura'
          New-ThemeScreen 'publish/Assets/Screens/BRB_TikTok_1080x1920.png' 1080 1920 'BE RIGHT BACK' 'sakura'

          $theme='publish/Assets/Themes/Profile_B_Doctor'
          New-MedicalFrame "$theme/Frames/Discord_1080p.png" 1920 1080
          New-MedicalFrame "$theme/Frames/TikTok_1080x1920.png" 1080 1920
          New-ThemeScreen "$theme/Screens/Starting_1080p.jpg" 1920 1080 'STARTING SOON' 'doctor'
          New-ThemeScreen "$theme/Screens/BRB_1080p.jpg" 1920 1080 'BE RIGHT BACK' 'doctor'
          New-ThemeScreen "$theme/Screens/Starting_TikTok_1080x1920.jpg" 1080 1920 'STARTING SOON' 'doctor'
          New-ThemeScreen "$theme/Screens/BRB_TikTok_1080x1920.jpg" 1080 1920 'BE RIGHT BACK' 'doctor'

      - name: Verify and package
        shell: pwsh
        run: |
          $required=@(
            'publish/BPSRStreamKit.exe',
            'publish/Assets/Frames/01_Minimal_Thin_1080p.png',
            'publish/Assets/Frames/05_TikTok_Minimal_1080x1920.png',
            'publish/Assets/Screens/Starting_1080p.png',
            'publish/Assets/Screens/BRB_1080p.png',
            'publish/Assets/Screens/Starting_TikTok_1080x1920.png',
            'publish/Assets/Screens/BRB_TikTok_1080x1920.png',
            'publish/Assets/MyAvatar/idle.png',
            'publish/Assets/Themes/Profile_B_Doctor/Avatar/idle.png',
            'publish/Assets/Themes/Profile_B_Doctor/Avatar/action.png',
            'publish/Assets/Themes/Profile_B_Doctor/Frames/Discord_1080p.png',
            'publish/Assets/Themes/Profile_B_Doctor/Frames/TikTok_1080x1920.png',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/Starting_1080p.jpg',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/BRB_1080p.jpg',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/Starting_TikTok_1080x1920.jpg',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/BRB_TikTok_1080x1920.jpg',
            'publish/templates/basic/scenes/BPSR_Horizontal.json',
            'publish/templates/basic/scenes/BPSR_TikTok_Vertical.json'
          )
          foreach($f in $required){if(-not(Test-Path $f)){throw "Missing release file: $f"}}
          @"
          StreamKit v2.0.4

          1. Extract the whole ZIP and run BPSRStreamKit.exe. Windows will ask for administrator permission; allow it so StreamKit can reliably inspect/capture elevated games and control its portable OBS process.
          2. Open the game you want to stream and press Find games if needed.
          3. Choose an Avatar, Frame Style and Stream Mode.

          Full VTuber first use:
          - StreamKit installs Spout2 into its portable OBS automatically.
          - In VTube Studio choose your model/webcam, enable Spout2 output, use Color Picker Background, enable Transparent in capture, and leave the sender as VTubeStudioSpout.
          - For face movement, enable camera tracking and calibrate in VTube Studio. Camera tracking already drives mouth movement; Advanced Lipsync + microphone is optional.
          - Check my avatar no longer needs a game running. StreamKit verifies the transparent avatar frame and auto-fits it for horizontal and TikTok vertical Live layouts.

          Discord Share:
          - Click Start Discord Share. StreamKit opens Windowed Projector (Program) automatically.
          - In Discord -> Share Your Screen -> choose the OBS Windowed Projector with sound.
          - Keep your normal Discord microphone selected. StreamKit excludes the OBS mic from Discord share audio to avoid double voice.

          Discord + Twitch + TikTok:
          - One-time: connect Twitch in portable OBS and configure a TikTok Vertical output in Aitum Stream Suite.
          - Twitch/TikTok receive selected-game audio + your RNNoise mic. Desktop/system audio is disabled so Discord friends are excluded.
          - StreamKit opens the Discord projector too; its audio path contains game audio, not the OBS mic.

          Repair:
          - Fix setup clean-reinstalls the selected runtime plugins and rebuilds StreamKit scenes while preserving account/output configuration.
          - StreamKit verifies OBS and Spout with pinned SHA-256 values and FloodTuber/Aitum with official GitHub release-asset SHA-256 digests.

          While active use StreamKit's Starting Soon / Live / BRB / Mic controls instead of touching OBS.
          StreamKit intentionally disables update prompts in its portable OBS copy because OBS 32.2.1 and its plugins are pinned as a tested bundle.
          Stream keys/login data stay in your local portable OBS/Aitum configuration.
          VTube Studio is external and is not bundled with StreamKit.
          "@ | Set-Content publish/START_HERE.txt -Encoding UTF8
          Compress-Archive publish/* StreamKit-win-x64.zip -Force
          $check=Join-Path $env:RUNNER_TEMP 'streamkit-check';if(Test-Path $check){Remove-Item $check -Recurse -Force}
          Expand-Archive StreamKit-win-x64.zip $check -Force
          if(-not(Test-Path (Join-Path $check 'BPSRStreamKit.exe'))){throw 'Packaged ZIP is missing the launcher'}
          if(-not(Test-Path (Join-Path $check 'START_HERE.txt'))){throw 'Packaged ZIP is missing START_HERE'}
          if(-not(Test-Path (Join-Path $check 'README.md'))){throw 'Packaged ZIP is missing README'}
          if(-not(Test-Path (Join-Path $check 'THIRD_PARTY_NOTICES.md'))){throw 'Packaged ZIP is missing third-party notices'}
          if(-not(Test-Path (Join-Path $check 'Assets/Screens/BRB_1080p.png'))){throw 'Packaged ZIP is missing Profile A BRB'}
          if(-not(Test-Path (Join-Path $check 'Assets/Themes/Profile_B_Doctor/Screens/BRB_1080p.jpg'))){throw 'Packaged ZIP is missing Profile B BRB'}

      - uses: actions/upload-artifact@v4
        with:
          name: StreamKit-win-x64
          path: StreamKit-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreamKit-win-x64
          path: release-artifact
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          zip='release-artifact/StreamKit-win-x64.zip'
          version="${GITHUB_REF_NAME#release/}"
          target="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if gh release view "$version" >/dev/null 2>&1; then gh release delete "$version" --cleanup-tag --yes; fi
          gh release create "$version" "$zip" --target "$target" --generate-notes --title "StreamKit $version"
