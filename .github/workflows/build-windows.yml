name: Build Windows StreamKit

on:
  push:
    branches: [main, 'release/v*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build launcher
        run: |
          dotnet restore src/BPSRStreamKit/BPSRStreamKit.csproj
          dotnet publish src/BPSRStreamKit/BPSRStreamKit.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Copy portable assets
        shell: pwsh
        run: |
          if (Test-Path publish/Assets) { Remove-Item publish/Assets -Recurse -Force }
          if (Test-Path publish/templates) { Remove-Item publish/templates -Recurse -Force }
          Copy-Item Assets publish/Assets -Recurse -Force
          Copy-Item templates publish/templates -Recurse -Force
          Copy-Item README.md publish/README.md -Force
          Copy-Item THIRD_PARTY_NOTICES.md publish/THIRD_PARTY_NOTICES.md -Force

      - name: Generate themed frames and intermission screens
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          function Add-SakuraMark([Drawing.Graphics]$g,[Drawing.Brush]$brush,[int]$x,[int]$y,[int]$s) {
            $half=[int][Math]::Max(1,[Math]::Round($s/2))
            $g.FillEllipse($brush,$x,$y,$s,$s*2)
            $g.FillEllipse($brush,$x+$s,$y+$half,$s*2,$s)
          }

          function New-SakuraFrame([string]$Path,[int]$W,[int]$H) {
            New-Item -ItemType Directory -Force -Path (Split-Path $Path) | Out-Null
            $bmp=[Drawing.Bitmap]::new($W,$H,[Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.Clear([Drawing.Color]::Transparent)
            $pink=[Drawing.Color]::FromArgb(238,231,116,176)
            $violet=[Drawing.Color]::FromArgb(155,177,124,241)
            $soft=[Drawing.Color]::FromArgb(190,255,199,225)
            $p1=[Drawing.Pen]::new($pink,2)
            $p2=[Drawing.Pen]::new($violet,1)
            $b=[Drawing.SolidBrush]::new($soft)
            $m=1; $i=5
            $g.DrawRectangle($p1,$m,$m,$W-(2*$m)-1,$H-(2*$m)-1)
            $g.DrawRectangle($p2,$i,$i,$W-(2*$i)-1,$H-(2*$i)-1)
            $s=[int][Math]::Max(7,[Math]::Round([Math]::Min($W,$H)*0.008))
            Add-SakuraMark $g $b ($i+16) ($i+16) $s
            Add-SakuraMark $g $b ($W-$i-28) ($i+16) $s
            Add-SakuraMark $g $b ($i+16) ($H-$i-28) $s
            Add-SakuraMark $g $b ($W-$i-28) ($H-$i-28) $s
            $spark=[Drawing.Pen]::new($soft,1)
            $cx=[int]($W*0.5)
            $g.DrawLine($spark,$cx-10,$i+5,$cx+10,$i+5)
            $g.DrawLine($spark,$cx,$i,$cx,$i+10)
            $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Png)
            $spark.Dispose();$b.Dispose();$p1.Dispose();$p2.Dispose();$g.Dispose();$bmp.Dispose()
          }

          function New-MedicalFrame([string]$Path,[int]$W,[int]$H) {
            New-Item -ItemType Directory -Force -Path (Split-Path $Path) | Out-Null
            $bmp=[Drawing.Bitmap]::new($W,$H,[Drawing.Imaging.PixelFormat]::Format32bppArgb)
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.Clear([Drawing.Color]::Transparent)
            $cyan=[Drawing.Color]::FromArgb(238,31,211,235)
            $white=[Drawing.Color]::FromArgb(220,238,252,255)
            $soft=[Drawing.Color]::FromArgb(170,111,231,242)
            $p1=[Drawing.Pen]::new($cyan,2)
            $p2=[Drawing.Pen]::new($white,1)
            $p3=[Drawing.Pen]::new($soft,2)
            $m=1; $i=5
            $g.DrawRectangle($p1,$m,$m,$W-(2*$m)-1,$H-(2*$m)-1)
            $g.DrawRectangle($p2,$i,$i,$W-(2*$i)-1,$H-(2*$i)-1)
            $r=[int][Math]::Max(8,[Math]::Round([Math]::Min($W,$H)*0.009))
            $x=$i+22; $y=$i+22
            $g.DrawLine($p3,$x-$r,$y,$x+$r,$y); $g.DrawLine($p3,$x,$y-$r,$x,$y+$r)
            $x=$W-$i-22; $y=$H-$i-22
            $g.DrawLine($p3,$x-$r,$y,$x+$r,$y); $g.DrawLine($p3,$x,$y-$r,$x,$y+$r)
            $cy=$i+8; $cx=[int]($W*0.50); $step=[int][Math]::Max(8,[Math]::Round([Math]::Min($W,$H)*0.008))
            $pts=[Drawing.Point[]]@(
              [Drawing.Point]::new($cx-(4*$step),$cy),
              [Drawing.Point]::new($cx-(2*$step),$cy),
              [Drawing.Point]::new($cx-$step,$cy-$step),
              [Drawing.Point]::new($cx,$cy+$step),
              [Drawing.Point]::new($cx+$step,$cy-(2*$step)),
              [Drawing.Point]::new($cx+(2*$step),$cy),
              [Drawing.Point]::new($cx+(4*$step),$cy)
            )
            $g.DrawLines($p3,$pts)
            $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Png)
            $p1.Dispose();$p2.Dispose();$p3.Dispose();$g.Dispose();$bmp.Dispose()
          }

          function New-ThemeScreen([string]$Path,[string]$Avatar,[int]$W,[int]$H,[string]$Title,[string]$Theme) {
            New-Item -ItemType Directory -Force -Path (Split-Path $Path) | Out-Null
            $bmp=[Drawing.Bitmap]::new($W,$H,[Drawing.Imaging.PixelFormat]::Format24bppRgb)
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode=[Drawing.Drawing2D.SmoothingMode]::AntiAlias
            $g.InterpolationMode=[Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $vertical=$H -gt $W
            if($Theme -eq 'sakura') {
              $bg=[Drawing.Color]::FromArgb(20,12,28)
              $accent=[Drawing.Color]::FromArgb(232,122,177)
              $accent2=[Drawing.Color]::FromArgb(177,126,239)
              $white=[Drawing.Color]::FromArgb(251,241,249)
            } else {
              $bg=[Drawing.Color]::FromArgb(7,15,24)
              $accent=[Drawing.Color]::FromArgb(58,215,232)
              $accent2=[Drawing.Color]::FromArgb(206,248,255)
              $white=[Drawing.Color]::FromArgb(238,252,255)
            }
            $g.Clear($bg)
            $m=[int][Math]::Max(10,[Math]::Round([Math]::Min($W,$H)*0.012))
            $p=[Drawing.Pen]::new($accent,2)
            $p2=[Drawing.Pen]::new($accent2,1)
            $g.DrawRectangle($p,$m,$m,$W-(2*$m)-1,$H-(2*$m)-1)
            $g.DrawRectangle($p2,$m+7,$m+7,$W-(2*($m+7))-1,$H-(2*($m+7))-1)
            if($vertical) {
              $ts=[single][Math]::Max(72,$W*0.095)
              $ty=[single]($H*0.18)
              $ax=[int]($W*0.18);$ay=[int]($H*0.40);$aw=[int]($W*0.64);$ah=[int]($H*0.50)
            } else {
              $ts=[single][Math]::Max(76,$H*0.095)
              $ty=[single]($H*0.24)
              $ax=[int]($W*0.62);$ay=[int]($H*0.12);$aw=[int]($W*0.30);$ah=[int]($H*0.80)
            }
            $tf=[Drawing.Font]::new('Segoe UI',$ts,[Drawing.FontStyle]::Bold)
            $wb=[Drawing.SolidBrush]::new($white)
            $size=$g.MeasureString($Title,$tf)
            $tx=[single](($W-$size.Width)/2)
            $g.DrawString($Title,$tf,$wb,$tx,$ty)
            $img=[Drawing.Image]::FromFile($Avatar)
            $ratio=[Math]::Min($aw/$img.Width,$ah/$img.Height)
            $dw=[int]($img.Width*$ratio);$dh=[int]($img.Height*$ratio)
            $g.DrawImage($img,$ax+[int](($aw-$dw)/2),$ay+[int](($ah-$dh)/2),$dw,$dh)
            if($Theme -eq 'sakura') {
              $b=[Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(190,255,192,222))
              $s=[int][Math]::Max(10,[Math]::Round([Math]::Min($W,$H)*0.012))
              Add-SakuraMark $g $b ($m+30) ($m+30) $s
              Add-SakuraMark $g $b ($W-$m-55) ($H-$m-70) $s
              Add-SakuraMark $g $b ([int]($W*0.16)) ([int]($H*0.72)) $s
              $b.Dispose()
            } else {
              $med=[Drawing.Pen]::new($accent,3)
              $r2=[int][Math]::Max(12,[Math]::Round([Math]::Min($W,$H)*0.014))
              $x=$m+45;$y=$H-$m-55
              $g.DrawLine($med,$x-$r2,$y,$x+$r2,$y)
              $g.DrawLine($med,$x,$y-$r2,$x,$y+$r2)
              $med.Dispose()
            }
            if([IO.Path]::GetExtension($Path).ToLowerInvariant() -eq '.jpg') {
              $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Jpeg)
            } else {
              $bmp.Save($Path,[Drawing.Imaging.ImageFormat]::Png)
            }
            $img.Dispose();$tf.Dispose();$wb.Dispose();$p.Dispose();$p2.Dispose();$g.Dispose();$bmp.Dispose()
          }

          New-SakuraFrame 'publish/Assets/Frames/01_Minimal_Thin_1080p.png' 1920 1080
          New-SakuraFrame 'publish/Assets/Frames/05_TikTok_Minimal_1080x1920.png' 1080 1920
          New-ThemeScreen 'publish/Assets/Screens/Starting_1080p.png' 'publish/Assets/MyAvatar/idle.png' 1920 1080 'STARTING SOON' 'sakura'
          New-ThemeScreen 'publish/Assets/Screens/BRB_1080p.png' 'publish/Assets/MyAvatar/action.png' 1920 1080 'BE RIGHT BACK' 'sakura'
          New-ThemeScreen 'publish/Assets/Screens/Starting_TikTok_1080x1920.png' 'publish/Assets/MyAvatar/idle.png' 1080 1920 'STARTING SOON' 'sakura'
          New-ThemeScreen 'publish/Assets/Screens/BRB_TikTok_1080x1920.png' 'publish/Assets/MyAvatar/action.png' 1080 1920 'BE RIGHT BACK' 'sakura'

          $theme='publish/Assets/Themes/Profile_B_Doctor'
          New-MedicalFrame "$theme/Frames/Discord_1080p.png" 1920 1080
          New-MedicalFrame "$theme/Frames/TikTok_1080x1920.png" 1080 1920
          New-ThemeScreen "$theme/Screens/Starting_1080p.jpg" "$theme/Avatar/idle.png" 1920 1080 'STARTING SOON' 'doctor'
          New-ThemeScreen "$theme/Screens/BRB_1080p.jpg" "$theme/Avatar/action.png" 1920 1080 'BE RIGHT BACK' 'doctor'
          New-ThemeScreen "$theme/Screens/Starting_TikTok_1080x1920.jpg" "$theme/Avatar/idle.png" 1080 1920 'STARTING SOON' 'doctor'
          New-ThemeScreen "$theme/Screens/BRB_TikTok_1080x1920.jpg" "$theme/Avatar/action.png" 1080 1920 'BE RIGHT BACK' 'doctor'

      - name: Verify and package
        shell: pwsh
        run: |
          $required=@(
            'publish/BPSRStreamKit.exe',
            'publish/Assets/Frames/01_Minimal_Thin_1080p.png',
            'publish/Assets/Frames/05_TikTok_Minimal_1080x1920.png',
            'publish/Assets/Screens/Starting_1080p.png',
            'publish/Assets/Screens/BRB_1080p.png',
            'publish/Assets/Screens/Starting_TikTok_1080x1920.png',
            'publish/Assets/Screens/BRB_TikTok_1080x1920.png',
            'publish/Assets/MyAvatar/idle.png',
            'publish/Assets/Themes/Profile_B_Doctor/Avatar/idle.png',
            'publish/Assets/Themes/Profile_B_Doctor/Avatar/action.png',
            'publish/Assets/Themes/Profile_B_Doctor/Frames/Discord_1080p.png',
            'publish/Assets/Themes/Profile_B_Doctor/Frames/TikTok_1080x1920.png',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/Starting_1080p.jpg',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/BRB_1080p.jpg',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/Starting_TikTok_1080x1920.jpg',
            'publish/Assets/Themes/Profile_B_Doctor/Screens/BRB_TikTok_1080x1920.jpg',
            'publish/templates/basic/scenes/BPSR_Horizontal.json',
            'publish/templates/basic/scenes/BPSR_TikTok_Vertical.json'
          )
          foreach($f in $required){if(-not(Test-Path $f)){throw "Missing release file: $f"}}
          @"
          StreamKit v0.3.4

          1. Extract the whole ZIP.
          2. Run BPSRStreamKit.exe.
          3. Open the game you want to stream and press Scan games if needed.
          4. Choose Discord, Twitch or TikTok, choose a visual profile, then press the main Open Stream action.

          Discord: share the OBS Projector/preview window in Discord after StreamKit opens it.
          Twitch/TikTok: connect your local account/stream method in portable OBS, then start streaming from OBS.

          StreamKit is a generic game-streaming tool. Historical BPSR names remain only in some internal compatibility paths.
          "@ | Set-Content publish/START_HERE.txt -Encoding UTF8
          Compress-Archive publish/* StreamKit-win-x64.zip -Force
          $check=Join-Path $env:RUNNER_TEMP 'streamkit-check';if(Test-Path $check){Remove-Item $check -Recurse -Force}
          Expand-Archive StreamKit-win-x64.zip $check -Force
          if(-not(Test-Path (Join-Path $check 'BPSRStreamKit.exe'))){throw 'Packaged ZIP is missing the launcher'}
          if(-not(Test-Path (Join-Path $check 'Assets/Screens/BRB_1080p.png'))){throw 'Packaged ZIP is missing Profile A BRB'}
          if(-not(Test-Path (Join-Path $check 'Assets/Themes/Profile_B_Doctor/Screens/BRB_1080p.jpg'))){throw 'Packaged ZIP is missing Profile B BRB'}

      - uses: actions/upload-artifact@v4
        with:
          name: StreamKit-win-x64
          path: StreamKit-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreamKit-win-x64
          path: release-artifact
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          zip='release-artifact/StreamKit-win-x64.zip'
          if [[ "$GITHUB_REF" == refs/heads/release/v* ]]; then
            version="${GITHUB_REF_NAME#release/}"
            if gh release view "$version" >/dev/null 2>&1; then gh release delete "$version" --cleanup-tag --yes; fi
            gh release create "$version" "$zip" --target "$GITHUB_SHA" --generate-notes --title "StreamKit $version"
          else
            version="$GITHUB_REF_NAME"
            if gh release view "$version" >/dev/null 2>&1; then gh release upload "$version" "$zip" --clobber; else gh release create "$version" "$zip" --target "$GITHUB_SHA" --generate-notes --title "StreamKit $version"; fi
          fi
